s:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTLScontact will continue to receive Italian visa applicants until \u003cstrong\u003eJune 30, 2026\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eApplicants will be able to register on the TLScontact appointment waiting list (\u0026ldquo;live queue\u0026rdquo;) until \u003cstrong\u003eApril 30, 2026\u003c/strong\u003e. After that date, any non-verified requests will be transferred to the Italian Embassy for processing by the new service provider, under their procedures.\u003c/li\u003e\n\u003cli\u003eAfter the closure of its Italian visa centre, TLScontact will \u003cstrong\u003etransfer all applicant data\u003c/strong\u003e to the Embassy of Italy, the Personal Data Controller, for processing by the new supplier at the discretion of the Embassy. All applicant data will then be deleted from TLScontact systems.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eFor more information, please consult the \u003ca href=\"https://ambminsk.esteri.it/ru/news/dall_ambasciata/2026/04/получение-шенгенских-виз-в-посольств/\" target=\"_blank\" rel=\"noopener\"\u003e \u003cstrong\u003eEmbassy website\u003c/strong\u003e \u003c/a\u003e.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"14:T470,"])</script><script>self.__next_f.push([1,"\u003cp\u003eRegistration for submission at the TLScontact continues in manual mode for Live queue members.\u003c/p\u003e\n\u003cp\u003eFor \u003cspan style=\"text-decoration: underline;\"\u003eJUNE\u003c/span\u003e 2026, \u003cspan style=\"text-decoration: underline;\"\u003ePRIME TIME\u003c/span\u003e slots in MINSK are offered.\u003c/p\u003e\n\u003cp\u003ePrice of this additional service make BYN 135 per applicant.\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://visas-it.tlscontact.com/en-us/country/by/vac/byMSQ2it/services\"\u003ehttps://visas-it.tlscontact.com/en-us/country/by/vac/byMSQ2it/services\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eApplication period:\u003cstrong\u003e after publishing till April, 13th.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eRange of numbers of the live queue for participation: \u003cstrong\u003e33 000 - 35 999.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ePlease follow the requirements for your inquiries in FAQ section: Live Queue. Manual registration sessions.\u003c/p\u003e\n\u003cp\u003ePlease provide your group number adding English M letter before the number (Mxxxxxxx).\u003c/p\u003e\n\u003cp\u003eGeneral information can be found in \u003ca href=\"https://visas-it.tlscontact.com/en-us/information/help-centre?vac=byMSQ2it\"\u003eFAQ section\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eThe range of numbers for participation is set by TLScontact. We don\u0026rsquo;t accept any claims in this regard.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"6:[\"$\",\"$L12\",null,{\"cmsContent\":{\"backgroundImage\":\"/banner/vac-center-banner.webp\",\"buttonReadLess\":\"Read less\",\"buttonReadMore\":\"Read more\",\"mostRecentNews\":{\"id\":1862,\"content\":\"\u003cp\u003eFor the convenience of participants of the \u0026ldquo;Live Queue\u0026rdquo; residing in the regions, a priority service is offered on the following dates:\u003c/p\u003e\\n\u003cul\u003e\\n\u003cli\u003e17/06 - Vitebsk region\u003c/li\u003e\\n\u003cli\u003e19/06 - Mogilev region\u003c/li\u003e\\n\u003cli\u003e23/06 - Minsk region (not incl. Minsk district)\u003c/li\u003e\\n\u003cli\u003e24/06 - Brest region\u003c/li\u003e\\n\u003cli\u003e25/06 - Grodno region\u003c/li\u003e\\n\u003cli\u003e26/06 - Gomel region\u003c/li\u003e\\n\u003c/ul\u003e\\n\u003cp\u003e\u003cstrong\u003eApproximate walk-in invitation schedule (additional fee applies):\u003c/strong\u003e\u003c/p\u003e\\n\u003cul\u003e\\n\u003cli\u003e09:00 \u0026ndash; 11:30\u003c/li\u003e\\n\u003cli\u003e13:00 \u0026ndash; 15:00\u003c/li\u003e\\n\u003c/ul\u003e\\n\u003cp\u003e\u003cstrong\u003eImportant information:\u003c/strong\u003e\u003c/p\u003e\\n\u003cul\u003e\\n\u003cli\u003eReception is conducted only in Minsk.\u003c/li\u003e\\n\u003cli\u003eAdmission is limited to applicants from the specified regions. Applicants are admitted in ascending order of their \u0026ldquo;Live Queue\u0026rdquo; numbers.\u003c/li\u003e\\n\u003cli\u003eOnce all available slots are filled, admission will be closed, without an obligation to accept all applicants.\u003c/li\u003e\\n\u003c/ul\u003e\",\"image\":\"https://cache-cms.directuscloud.tlscontact.com/assets/ff49c503-00b2-461e-9683-231308b07863\",\"learnMoreUrl\":\"/country/by/vac/byMSQ2it/news\",\"learnMoreKeyword\":\"\",\"subtitle\":\"5/8/2026\",\"title\":\"Priority for nonresident participants of the \\\"live queue\\\" – June 2026\"},\"pageTitle\":\"News\"},\"newsList\":{\"count\":49,\"items\":[{\"id\":1857,\"content\":\"\u003cp\u003eAs previously announced by the Embassy of Italy on 15 April 2026, registration for the TLScontact waiting list (\u0026ldquo;Live queue\u0026rdquo;) was open until \u003cstrong\u003e30 April 2026\u003c/strong\u003e.\u003c/p\u003e\\n\u003cp\u003eWe confirm that:\u003c/p\u003e\\n\u003cul\u003e\\n\u003cli\u003eAfter \u003cstrong\u003e30 April 2026\u003c/strong\u003e, no new applications are accepted.\u003c/li\u003e\\n\u003cli\u003eThe email address \u003cstrong\u003e\u003ca href=\\\"mailto:lq2it@tlscontact.com\\\"\u003elq2it@tlscontact.com\u003c/a\u003e\u003c/strong\u003e is no longer active.\u003c/li\u003e\\n\u003c/ul\u003e\\n\u003cp\u003eApplications submitted \u003cstrong\u003ebefore 14 November 2025\u003c/strong\u003e or \u003cstrong\u003eafter 30 April 2026\u003c/strong\u003e have been cancelled.\u003c/p\u003e\\n\u003cp\u003eAs of \u003cstrong\u003e30 April 2026\u003c/strong\u003e, the verification of submitted applications has been completed.\u003c/p\u003e\\n\u003cp\u003eApplications not verified by TLScontact have been transferred to the Embassy of Italy for further processing by a new service provider. TLScontact is not involved in this process and cannot provide information on timelines or procedures.\u003c/p\u003e\",\"image\":\"https://cache-cms.directuscloud.tlscontact.com/assets/ff49c503-00b2-461e-9683-231308b07863\",\"learnMoreUrl\":\"/country/by/vac/byMSQ2it/news\",\"learnMoreKeyword\":\"\",\"subtitle\":\"5/5/2026\",\"title\":\"Live Queue Registration Closed\"},{\"id\":1855,\"content\":\"\u003cp\u003ePlease note that TLScontact will \u003cstrong\u003efinish\u003c/strong\u003e accepting \u003cstrong\u003eappointment requests\u003c/strong\u003e from \u003cstrong\u003erelatives of EU citizens\u003c/strong\u003e or Belarusian citizens residing in Italy on \u003cstrong\u003eApril 30, 2026\u003c/strong\u003e, as part of the transition to the new service provider for Italian visa application processing.\u003c/p\u003e\\n\u003cp\u003eFor requests received before that date, TLScontact will book appointments \u003cstrong\u003euntil June 30, 2026\u003c/strong\u003e, \u003cstrong\u003esubject to availability.\u003c/strong\u003e\u003c/p\u003e\\n\u003cp\u003eUnserved requests will then be transferred to the Embassy of Italy for processing by the new service provider, and applicants will be notified via email.\u003c/p\u003e\\n\u003cp\u003eFrom \u003cstrong\u003eMay 1\u003csup\u003est\u003c/sup\u003e 2026\u003c/strong\u003e, requests for priority appointments should be sent to the \u003cstrong\u003enew supplier\u003c/strong\u003e\u0026nbsp;only, as explained on the \u003ca href=\\\"https://ambminsk.esteri.it/ru/news/dall_ambasciata/2026/04/шенгенские-визы-с-выданные-посольств/\\\"\u003e \u003cstrong\u003eEmbassy website\u003c/strong\u003e \u003c/a\u003e.\u003c/p\u003e\",\"image\":\"https://cache-cms.directuscloud.tlscontact.com/assets/ff49c503-00b2-461e-9683-231308b07863\",\"learnMoreUrl\":\"/country/by/vac/byMSQ2it/news\",\"learnMoreKeyword\":\"\",\"subtitle\":\"4/29/2026\",\"title\":\"END OF APPOINTMENT REQUESTS FROM RELATIVES OF EU CITIZENS \"},{\"id\":1850,\"content\":\"\u003cp\u003e\u003cstrong\u003eValid live queue numbers\u003c/strong\u003e will be serviced by TLScontact until \u003cstrong\u003eJune 30, 2026\u003c/strong\u003e. From \u003cstrong\u003eJune 1, 2026\u003c/strong\u003e, numbers starting \u003cstrong\u003efrom 23 001\u003c/strong\u003e are valid\u003cstrong\u003e.\u003c/strong\u003e\u003c/p\u003e\\n\u003cp\u003eLive queue numbers \u003cstrong\u003efrom 35 884\u003c/strong\u003e onwards are subject to \u003cstrong\u003etransfer\u003c/strong\u003e to the \u003cstrong\u003eItalian Embassy\u003c/strong\u003e for further processing by the \u003cstrong\u003enew service provider\u003c/strong\u003e, in accordance with their procedures.\u003c/p\u003e\\n\u003cp\u003ePlease note that \u003cstrong\u003e\u003cu\u003eall\u003c/u\u003e live queue data\u003c/strong\u003e will be transferred to the Italian Embassy for control purposes.\u003c/p\u003e\\n\u003cp\u003eFor more information on live queue conditions, please consult our \u003cstrong\u003e\u003ca href=\\\"/en-us/country/by/vac/byMSQ2it/help-centre\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\"\u003eFAQ page.\u003c/a\u003e\u003c/strong\u003e\u003c/p\u003e\",\"image\":\"https://cache-cms.directuscloud.tlscontact.com/assets/ff49c503-00b2-461e-9683-231308b07863\",\"learnMoreUrl\":\"/country/by/vac/byMSQ2it/news\",\"learnMoreKeyword\":\"\",\"subtitle\":\"4/23/2026\",\"title\":\"MANAGEMENT OF LIVE QUEUE DURING TRANSITION PERIOD\"},{\"id\":1849,\"content\":\"$13\",\"image\":\"https://cache-cms.directuscloud.tlscontact.com/assets/ff49c503-00b2-461e-9683-231308b07863\",\"learnMoreUrl\":\"/country/by/vac/byMSQ2it/news\",\"learnMoreKeyword\":\"\",\"subtitle\":\"4/22/2026\",\"title\":\"TRANSFER OF ITALIAN VISA PROCESSING TO NEW PROVIDER: PROCEDURE\"},{\"id\":1840,\"content\":\"\u003cp\u003eDue to unstable work of data processing system the Regional days for April 2026 are canceled. The updates will be published later.\u003c/p\u003e\",\"image\":\"https://cache-cms.directuscloud.tlscontact.com/assets/ff49c503-00b2-461e-9683-231308b07863\",\"learnMoreUrl\":\"/country/by/vac/byMSQ2it/news\",\"learnMoreKeyword\":\"\",\"subtitle\":\"4/15/2026\",\"title\":\"CHANGE IN REGIONAL DAYS SCHEDULE APRIL\"},{\"id\":1837,\"content\":\"$14\",\"image\":\"https://cache-cms.directuscloud.tlscontact.com/assets/ff49c503-00b2-461e-9683-231308b07863\",\"learnMoreUrl\":\"/country/by/vac/byMSQ2it/news\",\"learnMoreKeyword\":\"\",\"subtitle\":\"4/13/2026\",\"title\":\"RELEASE OF SLOTS – SESSION №28.2 – MINSK\"}]},\"page\":1,\"banner\":\"$L15\"}]\n"])</script><script>self.__next_f.push([1,"15:null\n"])</script></body></html>
