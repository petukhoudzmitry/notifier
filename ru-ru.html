u003e.\u003c/li\u003e\n\u003cli\u003eЗапросы в лист ожидания (\u0026laquo;живая очередь\u0026raquo;) принимаются до \u003cstrong\u003e30 апреля 2026 года\u003c/strong\u003e. Запросы, не прошедшие верификацию в TLScontact, передаются Посольству Италии для дальнейшей обработки у нового подрядчика по их процедурам.\u003c/li\u003e\n\u003cli\u003eПри завершении работы визового центра Италии TLScontact обязан \u003cstrong\u003eпередать все данные заявителей\u003c/strong\u003e Посольству как оператору данных. На усмотрение Посольства данные могут быть использованы новым подрядчиком. После передачи данных TLScontact удаляет их из своих систем.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eСледите за информацией на \u003ca href=\"https://ambminsk.esteri.it/ru/news/dall_ambasciata/2026/04/получение-шенгенских-виз-в-посольств/\" target=\"_blank\" rel=\"noopener\"\u003e \u003cstrong\u003eсайте Посольства Италии\u003c/strong\u003e \u003c/a\u003e.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"14:T645,"])</script><script>self.__next_f.push([1,"\u003cp\u003eЗапись на подачу в визовый центр TLScontact продолжается в ручном режиме для живой очереди.\u003c/p\u003e\r\n\u003cp\u003eНа \u003cspan style=\"text-decoration: underline;\"\u003eИЮНЬ\u003c/span\u003e 2026 предлагаются слоты \u003cspan style=\"text-decoration: underline;\"\u003eПРАЙМ ТАЙМ\u003c/span\u003e в МИНСКе.\u003c/p\u003e\r\n\u003cp\u003eСтоимость дополнительной услуги BYN 135 с каждого заявителя.\u003c/p\u003e\r\n\u003cp\u003e\u003ca href=\"https://visas-it.tlscontact.com/ru-ru/country/by/vac/byMSQ2it/services\"\u003ehttps://visas-it.tlscontact.com/ru-ru/country/by/vac/byMSQ2it/services\u003c/a\u003e\u003c/p\u003e\r\n\u003cp\u003eПериод приема заявок: \u003cstrong\u003eс момента публикации по 13 апреля 2026 г.\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003eДиапазон номеров живой очереди для участия: \u003cstrong\u003e33 000 - 35 999.\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003eПросим в заявке указать номер группы, дописав перед цифрами английскую букву M (т.е. в формате Mxxxxxxx). Правила оформления и обработки заявок указаны в разделе Помощь: Живая очередь. Сессия записи. Общая информация по живой очереди также доступна в разделе \u003ca href=\"https://visas-it.tlscontact.com/ru-ru/information/help-centre?vac=byMSQ2it\" target=\"_blank\" rel=\"noopener\"\u003eПомощь.\u003c/a\u003e\u003c/p\u003e\r\n\u003cp\u003eTLScontact не принимает претензий по диапазону номеров.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"6:[\"$\",\"$L12\",null,{\"cmsContent\":{\"backgroundImage\":\"/banner/vac-center-banner.webp\",\"buttonReadLess\":\"Читать меньше\",\"buttonReadMore\":\"Читать больше\",\"mostRecentNews\":{\"id\":1862,\"content\":\"\u003cp\u003eДля удобства подачи документов участниками \u0026laquo;Живой очереди\u0026raquo;, проживающими в регионах, предлагается приоритетное обслуживание в следующие дни:\u003c/p\u003e\\n\u003cul\u003e\\n\u003cli\u003e17 июня \u0026ndash; Витебская область\u003c/li\u003e\\n\u003cli\u003e19 июня \u0026ndash; Могилевская область\u003c/li\u003e\\n\u003cli\u003e23 июня \u0026ndash; Минская область (кроме Минского района)\u003c/li\u003e\\n\u003cli\u003e24 июня \u0026ndash; Брестская область\u003c/li\u003e\\n\u003cli\u003e25 июня \u0026ndash; Гродненская область\u003c/li\u003e\\n\u003cli\u003e26 июня \u0026ndash; Гомельская область\u003c/li\u003e\\n\u003c/ul\u003e\\n\u003cp\u003e\u003cstrong\u003eПримерный график приёма без предварительной записи (за дополнительную плату):\u003c/strong\u003e\u003c/p\u003e\\n\u003cul\u003e\\n\u003cli\u003e09:00\u0026ndash;11:30\u003c/li\u003e\\n\u003cli\u003e13:00\u0026ndash;15:00\u003c/li\u003e\\n\u003c/ul\u003e\\n\u003cp\u003e\u003cstrong\u003eОбратите внимание:\u003c/strong\u003e\u003c/p\u003e\\n\u003cul\u003e\\n\u003cli\u003eПриём осуществляется исключительно в Минске.\u003c/li\u003e\\n\u003cli\u003eПриём ведётся только для заявителей из указанных регионов. Обслуживание осуществляется в порядке возрастания номеров \u0026laquo;Живой очереди\u0026raquo;.\u003c/li\u003e\\n\u003cli\u003eПосле исчерпания доступного резерва мест приём прекращается без обязательства принять всех заявителей.\u003c/li\u003e\\n\u003c/ul\u003e\",\"image\":\"https://cache-cms.directuscloud.tlscontact.com/assets/ff49c503-00b2-461e-9683-231308b07863\",\"learnMoreUrl\":\"/country/by/vac/byMSQ2it/news\",\"learnMoreKeyword\":\"\",\"subtitle\":\"5/8/2026\",\"title\":\"Приоритет для иногородних участников «живой очереди» – июнь 2026\"},\"pageTitle\":\"Новости\"},\"newsList\":{\"count\":49,\"items\":[{\"id\":1857,\"content\":\"\u003cp\u003eКак было объявлено Посольством Италии 15 апреля 2026 года, регистрация в листе ожидания TLScontact (\u0026laquo;Живая очередь\u0026raquo;) была открыта до \u003cstrong\u003e30 апреля 2026 года\u003c/strong\u003e.\u003c/p\u003e\\n\u003cp\u003eПодтверждаем, что:\u003c/p\u003e\\n\u003cp\u003eПосле \u003cstrong\u003e30 апреля 2026 года\u003c/strong\u003e новые заявки не принимаются.\u003cbr\u003eАдрес электронной почты \u003cstrong\u003e\u003ca href=\\\"mailto:lq2it@tlscontact.com\\\"\u003elq2it@tlscontact.com\u003c/a\u003e\u003c/strong\u003e больше не действует.\u003cbr\u003eЗаявки, поданные \u003cstrong\u003eдо 14 ноября 2025 года\u003c/strong\u003e или \u003cstrong\u003eпосле 30 апреля 2026 года\u003c/strong\u003e, были отменены.\u003c/p\u003e\\n\u003cp\u003eПо состоянию на \u003cstrong\u003e30 апреля 2026 года\u003c/strong\u003e верификация заявок окончена.\u003c/p\u003e\\n\u003cp\u003eЗаявки, не прошедшие верификацию в TLScontact, переданы в Посольство Италии для дальнейшей обработки новым подрядчиком. TLScontact не участвует в данном процессе и не может предоставить информацию о сроках и процедурах.\u003c/p\u003e\",\"image\":\"https://cache-cms.directuscloud.tlscontact.com/assets/ff49c503-00b2-461e-9683-231308b07863\",\"learnMoreUrl\":\"/country/by/vac/byMSQ2it/news\",\"learnMoreKeyword\":\"\",\"subtitle\":\"5/5/2026\",\"title\":\"Регистрация в «Живую очередь» окончена\"},{\"id\":1855,\"content\":\"\u003cp\u003e\\n  Напоминаем, что в рамках перехода к новому поставщику услуг по обработке заявлений \\n  на итальянскую визу TLScontact \u003cstrong\u003eзавершает прием запросов\u003c/strong\u003e \\n  от \u003cstrong\u003eродственников граждан ЕС\u003c/strong\u003e и белорусских граждан, проживающих в Италии, \\n  \u003cstrong\u003e30 апреля 2026 г.\u003c/strong\u003e\\n\u003c/p\u003e\\n\\n\u003cp\u003e\\n  Запросы, полученные до этой даты, будут обработаны, и запись на подачу \\n  будет осуществляться до \u003cstrong\u003e30 июня 2026 года\u003c/strong\u003e, при наличии доступных мест.\\n\u003c/p\u003e\\n\\n\u003cp\u003e\\n  Необработанные запросы будут переданы в Посольство Италии для дальнейшей обработки \\n  новым поставщиком услуг. Заявители будут уведомлены по электронной почте.\\n\u003c/p\u003e\\n\\n\u003cp\u003e\\n  С \u003cstrong\u003e1 мая 2026 года\u003c/strong\u003e заявки на приоритетную запись следует направлять \\n  только \u003cstrong\u003eновому поставщику услуг\u003c/strong\u003e, как указано на \\n  \u003ca href=\\\"https://ambminsk.esteri.it/ru/news/dall_ambasciata/2026/04/шенгенские-визы-с-выданные-посольств/\\\"\u003e\\n    \u003cstrong\u003eсайте Посольства\u003c/strong\u003e\\n  \u003c/a\u003e.\\n\u003c/p\u003e\",\"image\":\"https://cache-cms.directuscloud.tlscontact.com/assets/ff49c503-00b2-461e-9683-231308b07863\",\"learnMoreUrl\":\"/country/by/vac/byMSQ2it/news\",\"learnMoreKeyword\":\"\",\"subtitle\":\"4/29/2026\",\"title\":\"ЗАВЕРШЕНИЕ ПРИЕМА ЗАПРОСОВ ОТ РОДСТВЕННИКОВ ГРАЖДАН ЕС\"},{\"id\":1850,\"content\":\"\u003cp\u003e\u003cstrong\u003eДействующие номера \u0026laquo;Живой очереди\u0026raquo;\u003c/strong\u003e обслуживаются в TLScontact до 30 июня 2026 г. \u003cstrong\u003eС 1 июня 2026 г\u003c/strong\u003e. действующими являются номера \u003cstrong\u003eначиная с 23 001\u003c/strong\u003e.\u003c/p\u003e\\n\u003cp\u003eНомера \u0026laquo;Живой очереди\u0026raquo; \u003cstrong\u003eс 35 884\u003c/strong\u003e и до последнего зарегистрированного \u003cstrong\u003eпередаются Посольству Италии\u003c/strong\u003e для дальнейшей обработки \u003cstrong\u003eу нового подрядчика\u003c/strong\u003e по их технологии.\u003c/p\u003e\\n\u003cp\u003eДля целей контроля Посольство получит \u003cstrong\u003eвесь объём данных\u003c/strong\u003e \u0026laquo;Живой очереди\u0026raquo;.\u003c/p\u003e\\n\u003cp\u003eБольше информации об условиях \u0026laquo;Живой очереди\u0026raquo; на странице \u003cstrong\u003e\u003ca href=\\\"/ru-ru/country/by/vac/byMSQ2it/help-centre\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\"\u003e\u0026laquo;Помощь\u0026raquo;.\u003c/a\u003e\u003c/strong\u003e\u003c/p\u003e\",\"image\":\"https://cache-cms.directuscloud.tlscontact.com/assets/ff49c503-00b2-461e-9683-231308b07863\",\"learnMoreUrl\":\"/country/by/vac/byMSQ2it/news\",\"learnMoreKeyword\":\"\",\"subtitle\":\"4/23/2026\",\"title\":\"РЕГУЛИРОВАНИЕ «ЖИВОЙ ОЧЕРЕДИ» В ПЕРЕХОДНЫЙ ПЕРИОД\"},{\"id\":1849,\"content\":\"$13\",\"image\":\"https://cache-cms.directuscloud.tlscontact.com/assets/ff49c503-00b2-461e-9683-231308b07863\",\"learnMoreUrl\":\"/country/by/vac/byMSQ2it/news\",\"learnMoreKeyword\":\"\",\"subtitle\":\"4/22/2026\",\"title\":\"ВИЗОВЫЙ ЦЕНТР ИТАЛИИ: ПРОЦЕДУРА ПЕРЕХОДА К НОВОМУ ПОДРЯДЧИКУ\"},{\"id\":1840,\"content\":\"\u003cp\u003eВвиду нестабильной работы системы обработки данных Региональные дни на Апрель 2026 отменяются. Новая информация будет опубликована позже.\u003c/p\u003e\",\"image\":\"https://cache-cms.directuscloud.tlscontact.com/assets/ff49c503-00b2-461e-9683-231308b07863\",\"learnMoreUrl\":\"/country/by/vac/byMSQ2it/news\",\"learnMoreKeyword\":\"\",\"subtitle\":\"4/15/2026\",\"title\":\"ИЗМЕНЕНИЯ В ГРАФИКЕ РЕГИОНАЛЬНЫХ ДНЕЙ - АПРЕЛЬ\"},{\"id\":1837,\"content\":\"$14\",\"image\":\"https://cache-cms.directuscloud.tlscontact.com/assets/ff49c503-00b2-461e-9683-231308b07863\",\"learnMoreUrl\":\"/country/by/vac/byMSQ2it/news\",\"learnMoreKeyword\":\"\",\"subtitle\":\"4/13/2026\",\"title\":\"О ВЫПУСКЕ СЛОТОВ И ЗАПИСИ – СЕССИЯ №28.2 – МИНСК\"}]},\"page\":1,\"banner\":\"$L15\"}]\n"])</script><script>self.__next_f.push([1,"15:null\n"])</script></body></html>
