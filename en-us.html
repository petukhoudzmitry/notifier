03c/p\u003e\\n\u003cp\u003eWe do not conduct random checks on the fact of receipt.\u003c/p\u003e\\n\u003cp\u003eFor other questions related to verification or \\\"Live Queue\\\" procedures, please contact only through the Call center or the Feedback form on the website.\u003c/p\u003e\",\"image\":\"https://cache-cms.directuscloud.tlscontact.com/assets/ff49c503-00b2-461e-9683-231308b07863\",\"learnMoreUrl\":\"/country/by/vac/byMSQ2it/news\",\"learnMoreKeyword\":\"\",\"subtitle\":\"2/5/2026\",\"title\":\"PROCESSING OF APPLICATIONS TO THE \\\"LIVE QUEUE\\\" - UPDATED\"},{\"id\":1750,\"content\":\"$13\",\"image\":\"https://cache-cms.directuscloud.tlscontact.com/assets/ff49c503-00b2-461e-9683-231308b07863\",\"learnMoreUrl\":\"/country/by/vac/byMSQ2it/news\",\"learnMoreKeyword\":\"\",\"subtitle\":\"1/29/2026\",\"title\":\"PRIORITY FOR NONRESIDENT PARTICIPANTS OF THE \\\"LIVE QUEUE\\\"\"}]},\"page\":1,\"banner\":\"$L14\"}]\n"])</script><script>self.__next_f.push([1,"14:null\na:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"News | TLScontact Minsk\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"News | TLScontact Minsk\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"32x32\"}],[\"$\",\"$L15\",\"3\",{}]],\"error\":null,\"digest\":\"$undefined\"}\nf:\"$a:metadata\"\n"])</script><script>self.__next_f.push([1,"5:E{\"digest\":\"1064821201\"}\n"])</script><script>self.__next_f.push([1,"4:E{\"digest\":\"4159170743\"}\n"])</script></body></html>
